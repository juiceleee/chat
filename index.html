<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Excel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='2' fill='%23217346'/><rect x='3' y='3' width='10' height='10' fill='white'/><path d='M5.5 5 L8 8 L5.5 11 M10.5 5 L8 8 L10.5 11' stroke='%23217346' stroke-width='1.2' fill='none'/></svg>" />
<style>
  :root {
    --xl-green: #217346;
    --grid: #e0e0e0;
    --hdr: #f5f5f5;
    --text: #1f2937;
    --text-dim: #6b7280;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f3f4f6;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- 통합 문서 열기 (로그인) ---------- */
  #login {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    padding: 30px 28px 26px;
    margin: 16px;
  }
  .doc-head { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .doc-icon { width: 24px; height: 24px; }
  .doc-title { font-size: 17px; font-weight: 600; }
  .doc-sub { color: var(--text-dim); font-size: 13px; margin: 2px 0 24px; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin: 16px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 14px;
    background: #fff; border: 1px solid #d1d5db;
    border-radius: 7px; color: var(--text); outline: none;
    transition: border-color .15s ease;
  }
  input:focus { border-color: var(--xl-green); }
  button { cursor: pointer; border: none; font-family: inherit; }
  .btn-open {
    width: 100%; margin-top: 22px; padding: 11px;
    background: var(--xl-green); color: #fff; font-size: 14px; font-weight: 600;
    border-radius: 7px; transition: filter .15s ease;
  }
  .btn-open:hover { filter: brightness(1.1); }
  .btn-open:disabled { opacity: .5; cursor: not-allowed; }
  .config-warning {
    margin-top: 16px; padding: 10px 12px; font-size: 12px; line-height: 1.6;
    background: #fef3c7; border: 1px solid #fcd34d; border-radius: 7px; color: #92400e;
  }

  /* ---------- 스프레드시트 (채팅) ---------- */
  #sheet { display: none; flex-direction: column; height: 100vh; width: 100%; background: #fff; }

  .xl-menu {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 7px 14px; background: #f3f3f3; border-bottom: 1px solid #d9d9d9;
    font-size: 13px; color: #444;
  }
  .xl-menu .fname { font-weight: 600; color: #217346; }
  .xl-menu .tabs { display: flex; gap: 15px; }
  .xl-menu .tabs span { cursor: default; }
  .xl-menu .tabs .active { color: var(--xl-green); font-weight: 600; box-shadow: inset 0 -2px 0 var(--xl-green); padding-bottom: 5px; }
  .xl-menu .spacer { margin-left: auto; }
  .zoom { display: flex; align-items: center; gap: 4px; }
  .zoom button {
    width: 24px; height: 24px; line-height: 1; font-size: 14px; font-weight: 600;
    background: #fff; color: #444; border: 1px solid #c5c5c5; border-radius: 4px;
  }
  .zoom button:hover { background: #eee; }
  .zoom .size { font-size: 11px; color: var(--text-dim); min-width: 28px; text-align: center; }
  .xl-menu .close {
    background: #fff; color: #444; font-size: 12px;
    border: 1px solid #c5c5c5; padding: 4px 10px; border-radius: 4px;
  }
  .xl-menu .close:hover { background: #eee; }
  .xl-menu .notification-toggle[aria-checked="true"] { background: #eaf4ee; border-color: var(--xl-green); color: var(--xl-green); }
  .notification-toast {
    position: fixed; right: 14px; bottom: 70px; z-index: 10; display: flex; align-items: center; gap: 12px;
    max-width: min(360px, calc(100vw - 28px)); padding: 4px; background: #fff;
    border: 1px solid #b6d2c1; border-radius: 8px; box-shadow: 0 4px 18px #0002;
    font-size: 13px; line-height: 1.5; overflow-wrap: anywhere;
  }
  .notification-open { min-width: 0; padding: 8px 10px; background: none; color: inherit; font-size: inherit; line-height: inherit; text-align: left; overflow-wrap: anywhere; }
  .notification-open small { display: block; margin-top: 3px; color: var(--xl-green); }
  .notification-dismiss { flex-shrink: 0; padding: 8px; background: none; color: #666; font-size: 20px; }
  .notification-toast button:focus-visible { outline: 2px solid var(--xl-green); border-radius: 4px; }

  .xl-formula {
    display: flex; align-items: center; border-bottom: 1px solid #d9d9d9;
    background: #fff; font-size: 12.5px; color: #333;
  }
  .xl-formula .namebox { width: 66px; padding: 5px 8px; border-right: 1px solid #d9d9d9; }
  .xl-formula .fx { width: 32px; text-align: center; font-style: italic; color: #999; border-right: 1px solid #d9d9d9; padding: 5px 0; }
  .xl-formula .fcontent { flex: 1; min-width: 0; padding: 5px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .grid { flex: 1; min-height: 0; overflow: auto; }
  table.sheet { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.sheet th, table.sheet td { border: 1px solid var(--grid); }
  table.sheet thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--hdr); color: #666; font-weight: 600; text-align: center;
    height: 22px; font-size: 0.8em;
  }
  col.col-num { width: 42px; }
  col.col-a { width: 46%; }
  th.corner { width: 42px; }
  td.rownum {
    background: var(--hdr); color: #666; text-align: center;
    font-weight: 600; font-size: 0.78em; vertical-align: top; padding: 5px 0;
    position: sticky; left: 0;
  }
  td.c-a { padding: 5px 9px; vertical-align: top; color: #111; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
  tr.namerow td.c-a { font-weight: 700; }
  .msgtime { color: #9aa0a6; font-size: 0.8em; margin-left: 8px; white-space: nowrap; }
  tr.row:hover td { background: #f4f8f5; }
  tr.row:hover td.rownum { background: #e8efe9; }

  .cellbar {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 8px 12px; border-top: 1px solid #d9d9d9; background: #f9f9f9;
  }
  .cellbar textarea {
    flex: 1; min-width: 0; resize: none; font-family: inherit; font-size: 14px; line-height: 1.4;
    padding: 6px 9px; border: 1px solid #b7b7b7; border-radius: 3px;
    outline: none; max-height: 120px; color: var(--text);
  }
  .cellbar textarea:focus { border-color: var(--xl-green); }
  .cellbar .add {
    padding: 7px 16px; background: var(--xl-green); color: #fff; font-weight: 600;
    border-radius: 3px; font-size: 13px; align-self: stretch;
  }
  .cellbar .add:hover { filter: brightness(1.08); }
  .cellbar .sticker-toggle {
    align-self: stretch; min-width: 36px; padding: 4px 8px;
    background: #fff; color: var(--xl-green); border: 1px solid #b7b7b7;
    border-radius: 3px; font-size: 22px;
  }
  .sticker-panel {
    flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; max-height: min(65vh, 370px);
    border-top: 1px solid #d9d9d9; background: #fafcfb;
  }
  .sticker-header, .sticker-footer {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex-shrink: 0;
    font-size: 12px;
  }
  .sticker-tabs { display: flex; gap: 6px; max-width: 65%; overflow-x: auto; flex-shrink: 0; }
  .sticker-pack-tab {
    flex: 0 0 44px; height: 44px; padding: 4px; border-radius: 8px;
    background: transparent; transition: background .15s;
  }
  .sticker-pack-tab:hover { background: #f0f0f0; }
  .sticker-pack-tab[aria-selected="true"] { background: #fff2a8; box-shadow: inset 0 -2px 0 #d8b600; }
  .sticker-pack-tab:focus-visible { outline: 2px solid var(--xl-green); outline-offset: -2px; }
  .sticker-pack-tab img { display: block; width: 36px; height: 36px; object-fit: contain; }
  .sticker-pack-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #555; }
  .sticker-close { flex-shrink: 0; margin-left: auto; background: none; font-size: 22px; color: #666; }
  .sticker-grid {
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px;
    overflow-y: auto; min-height: 0; padding: 4px 12px; max-width: 660px; width: 100%;
  }
  .sticker-choice { padding: 3px; background: #fff; border: 2px solid transparent; border-radius: 6px; }
  .sticker-choice[aria-pressed="true"] { border-color: var(--xl-green); background: #eaf4ee; }
  .sticker-choice img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: contain; }
  .sticker-footer { min-height: 64px; border-top: 1px solid #e5e7eb; }
  .sticker-footer img { width: 48px; height: 48px; object-fit: contain; }
  .sticker-footer span { flex: 1; color: var(--text-dim); }
  .sticker-footer button { padding: 8px 16px; background: var(--xl-green); color: #fff; border-radius: 4px; }
  .sticker-panel button:disabled { opacity: .5; cursor: default; }
  .sticker-replay { display: block; width: min(80px, 100%); padding: 0; background: none; border-radius: 4px; }
  .sticker-replay:focus-visible { outline: 2px solid var(--xl-green); outline-offset: 2px; }
  .sticker-message { display: block; width: min(80px, 100%); height: auto; aspect-ratio: 1; object-fit: contain; }
  @media (max-width: 480px) {
    .sticker-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-height: 480px) {
    .sticker-header, .sticker-footer { padding-top: 4px; padding-bottom: 4px; }
    .sticker-pack-tab { flex-basis: 36px; height: 36px; }
    .sticker-pack-tab img { width: 28px; height: 28px; }
    .sticker-footer { min-height: 40px; }
    .sticker-footer img { width: 32px; height: 32px; }
  }
</style>
</head>
<body>
  <!-- 통합 문서 열기 (로그인) -->
  <div id="login">
    <div class="doc-head">
      <svg class="doc-icon" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="2" fill="#217346"/>
        <path d="M8 8l3 4-3 4M16 8l-3 4 3 4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="doc-title">보호된 통합 문서</span>
    </div>
    <p class="doc-sub">이 통합 문서는 암호로 보호되어 있습니다. 열려면 정보를 입력하세요.</p>

    <label for="name">사용자</label>
    <input id="name" type="text" placeholder="이름" autocomplete="off" />

    <label for="pass">통합 문서 암호</label>
    <input id="pass" type="password" placeholder="암호 입력" autocomplete="off" />

    <button id="enter" class="btn-open">열기</button>

    <div id="configWarning" class="config-warning" style="display:none;">
      Firebase 설정이 필요합니다. (README 참고)
    </div>
  </div>

  <!-- 스프레드시트 (채팅) -->
  <div id="sheet">
    <div class="xl-menu">
      <span class="tabs">
        <span class="active">홈</span><span>삽입</span><span>페이지 레이아웃</span>
        <span>수식</span><span>데이터</span><span>검토</span><span>보기</span>
      </span>
      <span class="spacer"></span>
      <button id="notificationsToggle" class="close notification-toggle" role="switch" aria-checked="false" aria-label="새 메시지 알림" title="새 메시지 알림 켜기">🔕 알림 꺼짐</button>
      <div class="zoom">
        <button id="fontMinus" title="축소">−</button>
        <span class="size" id="fontSize">14</span>
        <button id="fontPlus" title="확대">+</button>
      </div>
      <button class="close" id="close">닫기</button>
    </div>

    <div class="xl-formula">
      <span class="namebox" id="cellRef">A1</span>
      <span class="fx">fx</span>
      <span class="fcontent" id="fcontent"></span>
    </div>

    <div class="grid">
      <table class="sheet">
        <colgroup>
          <col class="col-num" />
          <col class="col-a" />
          <col /><col /><col />
        </colgroup>
        <thead>
          <tr>
            <th class="corner"></th>
            <th>A</th><th>B</th><th>C</th><th>D</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <section id="stickerPanel" class="sticker-panel" aria-label="이모티콘 선택" hidden>
      <div class="sticker-header">
        <div id="stickerTabs" class="sticker-tabs" role="tablist" aria-label="이모티콘 묶음"></div>
        <span id="stickerPackName" class="sticker-pack-name"></span>
        <button id="stickerClose" class="sticker-close" aria-label="이모티콘 닫기">×</button>
      </div>
      <div id="stickerGrid" class="sticker-grid" role="tabpanel"></div>
      <div class="sticker-footer">
        <img id="stickerPreview" alt="" width="48" height="48" hidden />
        <span id="stickerLabel" aria-live="polite">이모티콘을 선택하세요.</span>
        <button id="stickerSend" disabled>보내기</button>
      </div>
    </section>

    <div class="cellbar">
      <button id="stickerToggle" class="sticker-toggle" aria-label="이모티콘" title="이모티콘" aria-controls="stickerPanel" aria-expanded="false" hidden>☺</button>
      <textarea id="text" rows="1" placeholder="셀에 입력..."></textarea>
      <button class="add" id="add">입력</button>
    </div>
  </div>

  <div id="notificationToast" class="notification-toast" hidden>
    <button id="notificationOpen" class="notification-open">
      <span id="notificationToastText" role="status" aria-live="polite"></span>
      <small>채팅창 열기 →</small>
    </button>
    <button id="notificationDismiss" class="notification-dismiss" aria-label="알림 닫기">×</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, limitToLast
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // =========================================================================
    // Firebase 설정
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDJmPA-dDphGDV8itduujWu3XxrwfQOaJY",
      authDomain: "chatting-99de3.firebaseapp.com",
      projectId: "chatting-99de3",
      storageBucket: "chatting-99de3.firebasestorage.app",
      messagingSenderId: "128388856345",
      appId: "1:128388856345:web:b5aea60f98e024c4388888",
      measurementId: "G-GWVN1W60GE"
    };

    // 기존 방의 ID는 이전 메시지의 저장 경로와 암호화에 쓰이므로 유지합니다.
    const ROOM_ID = "sjchat-private-2026";
    // 등록된 추가 암호만 별도 방으로 연결하고, 나머지는 기존 방으로 연결합니다.
    // 빈 passwordHash는 미사용 방입니다. 설정: node scripts/configure-room.mjs 3
    const ADDITIONAL_ROOMS = [
      {
        "id": "sjchat-private-2026-2",
        "passwordHash": "f896ca34bb333fdf6684a9e54bd38bfbbf6aafe50e69e05b30245a7ac75e6e5a"
      },
      {
        "id": "sjchat-private-2026-3",
        "passwordHash": ""
      }
    ];
    // 이미지는 정적 호스팅에서만 로드합니다. Firestore에는 4바이트 코드만 암호화합니다.
    const STICKER_PREFIX = "\u001e";
    // ID는 이전 대화에 저장되므로 변경하거나 다른 묶음에 재사용하지 않습니다.
    const STICKER_PACKS = [
      { id: "2", roomId: ROOM_ID + "-2", folder: "wonni-2", name: "리센느 X 안원잘부 2",
        count: 24, ext: "webp", animated: true },
      { id: "1", roomId: ROOM_ID + "-2", folder: "wonni-s1", name: "리센느 X 안원잘부 시즌1",
        count: 24, ext: "webp", animated: true },
      { id: "3", roomId: ROOM_ID, folder: "bear-in-love-ver-3", name: "사랑에 빠진 곰 3",
        count: 32, ext: "png", animated: false },
      { id: "4", roomId: ROOM_ID, folder: "rabbit-in-love-ver-3", name: "사랑에 빠진 토끼 3",
        count: 32, ext: "png", animated: false },
      { id: "5", roomId: ROOM_ID, folder: "bear-and-rabbit-are-in-love", name: "사랑에 빠져버린 곰&토끼 커플",
        count: 24, ext: "webp", animated: true }
    ];
    const STICKERS = new Map(STICKER_PACKS.flatMap(pack =>
      Array.from({ length: pack.count }, (_, i) => {
        const number = String(i + 1).padStart(2, "0");
        const id = pack.id + number;
        return [id, { id, pack: pack.id, roomId: pack.roomId, animated: pack.animated,
          label: `${pack.name} · ${i + 1}`, src: `assets/stickers/${pack.folder}/${number}.${pack.ext}` }];
      })
    ));
    // =========================================================================

    const isConfigured = !firebaseConfig.apiKey.startsWith("YOUR_");
    let db = null;
    if (isConfigured) {
      db = getFirestore(initializeApp(firebaseConfig));
    } else {
      document.getElementById("configWarning").style.display = "block";
    }

    // ---------- 암호화 (AES-GCM + PBKDF2) ----------
    const enc = new TextEncoder();
    const dec = new TextDecoder();

    async function resolveRoomId(passphrase) {
      const baseKey = await crypto.subtle.importKey(
        "raw", enc.encode(passphrase), "PBKDF2", false, ["deriveBits"]
      );
      const bits = await crypto.subtle.deriveBits(
        {
          name: "PBKDF2", salt: enc.encode("chat-room-routing:" + firebaseConfig.projectId),
          iterations: 100000, hash: "SHA-256"
        },
        baseKey, 256
      );
      const passwordHash = Array.from(new Uint8Array(bits), b => b.toString(16).padStart(2, "0")).join("");
      return ADDITIONAL_ROOMS.find(room => room.passwordHash === passwordHash)?.id || ROOM_ID;
    }

    async function deriveKey(passphrase, roomId) {
      const baseKey = await crypto.subtle.importKey(
        "raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode("chat-salt:" + roomId), iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }
    const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const fromB64 = (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0));

    async function encryptText(key, text) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(text));
      return { iv: toB64(iv), ct: toB64(ct) };
    }
    async function decryptText(key, ivB64, ctB64) {
      try {
        const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(ivB64) }, key, fromB64(ctB64));
        return dec.decode(pt);
      } catch {
        return "#VALUE!";
      }
    }

    // ---------- UI ----------
    const $ = (id) => document.getElementById(id);
    const loginEl = $("login");
    const sheetEl = $("sheet");
    const rowsEl = $("rows");
    const gridEl = document.querySelector(".grid");

    let currentBook = null;
    let opening = false;
    let unsubscribe = null;
    let lastSender = null;
    let selectedSticker = null;
    let stickerButtons = [];
    let activeStickerPack = null;
    let stickerPackButtons = [];
    const stickerBlobs = new Map();
    const stickerReplayUrls = new Set();
    const stickerReplayRequests = new WeakMap();
    let desktopNotification = null;
    let notificationToastTimer = null;

    const notificationPreferenceKey = roomId => "chatNotifications:" + roomId;

    function updateNotificationToggle() {
      const enabled = !!currentBook?.notificationsEnabled;
      $("notificationsToggle").setAttribute("aria-checked", String(enabled));
      $("notificationsToggle").textContent = enabled ? "🔔 알림 켜짐" : "🔕 알림 꺼짐";
      $("notificationsToggle").title = enabled ? "새 메시지 알림 끄기" : "새 메시지 알림 켜기";
    }

    function clearDesktopNotification() {
      document.title = "Excel";
      try { desktopNotification?.close(); } catch {}
      desktopNotification = null;
    }

    function clearNotifications() {
      clearTimeout(notificationToastTimer);
      $("notificationToast").hidden = true;
      $("notificationToastText").textContent = "";
      clearDesktopNotification();
    }

    function showNotificationToast(text) {
      clearTimeout(notificationToastTimer);
      $("notificationToastText").textContent = text;
      $("notificationToast").hidden = false;
      notificationToastTimer = setTimeout(() => { $("notificationToast").hidden = true; }, 7000);
    }

    function openNotificationChat(book = currentBook) {
      if (!book || currentBook !== book || !book.notificationsEnabled) return;
      globalThis.focus();
      clearNotifications();
      gridEl.scrollTop = gridEl.scrollHeight;
      $("text").focus();
    }

    async function toggleNotifications() {
      const book = currentBook;
      if (!book) return;
      book.notificationsEnabled = !book.notificationsEnabled;
      try { localStorage.setItem(notificationPreferenceKey(book.roomId), book.notificationsEnabled ? "on" : "off"); } catch {}
      updateNotificationToggle();
      if (!book.notificationsEnabled) { clearNotifications(); return; }
      // 시스템 배너 권한은 이 버튼을 직접 눌렀을 때만 요청합니다.
      try {
        const Notifications = globalThis.Notification;
        if (Notifications?.permission === "default") {
          showNotificationToast("브라우저의 알림 요청에서 ‘허용’을 눌러주세요. 요청이 안 보이면 주소창의 종 모양을 확인해 주세요.");
          await Notifications.requestPermission();
        }
        if (currentBook !== book || !book.notificationsEnabled) return;
        if (!Notifications) {
          showNotificationToast("화면 배너를 켰습니다. 이 브라우저에서는 시스템 배너를 사용할 수 없습니다.");
        } else if (Notifications.permission === "granted") {
          showNotificationToast("컴퓨터 배너 알림을 켰습니다. 다른 창을 보고 있을 때도 새 메시지를 조용히 알려드립니다.");
        } else if (Notifications.permission === "denied") {
          showNotificationToast("브라우저에서 알림이 차단되어 화면 안 배너만 켰습니다. 컴퓨터 배너를 받으려면 주소창의 사이트 설정에서 알림을 허용해 주세요.");
        } else {
          showNotificationToast("화면 안 배너를 켰습니다. 컴퓨터 배너는 아직 허용되지 않았습니다. 주소창의 알림 요청을 확인하거나 알림을 껐다 켜서 다시 요청해 주세요.");
        }
      } catch {
        if (currentBook === book && book.notificationsEnabled) {
          showNotificationToast("화면 배너를 켰습니다. 이 브라우저에서는 시스템 배너를 사용할 수 없습니다.");
        }
      }
    }

    function notifyReceivedMessage(book, sender) {
      if (currentBook !== book || !book.notificationsEnabled) return;
      const body = `${sender}님의 새 메시지가 있습니다.`;
      showNotificationToast(body);
      if (document.visibilityState === "visible" && document.hasFocus()) return;
      document.title = "● 새 메시지 · Excel";
      try {
        if (globalThis.Notification?.permission !== "granted") return;
        desktopNotification?.close();
        const notification = new Notification("새 메시지", { body, tag: "chat-" + book.roomId, silent: true });
        desktopNotification = notification;
        notification.onclick = (event) => {
          notification.close();
          if (currentBook !== book || !book.notificationsEnabled) { event.preventDefault(); return; }
          openNotificationChat(book);
        };
      } catch { /* 미지원 브라우저에서도 채팅과 화면 배너는 계속 동작합니다. */ }
    }

    function isStickerRoom(book = currentBook) {
      return STICKER_PACKS.some(pack => pack.roomId === book?.roomId);
    }

    function getRoomSticker(id, book = currentBook) {
      const sticker = STICKERS.get(id);
      return sticker && sticker.roomId === book?.roomId ? sticker : null;
    }

    function configureStickerPicker(book) {
      closeStickerPicker();
      const packs = STICKER_PACKS.filter(pack => pack.roomId === book.roomId);
      const tabs = $("stickerTabs");
      tabs.innerHTML = "";
      stickerPackButtons = [];
      activeStickerPack = packs[0]?.id || null;
      for (const pack of packs) {
        const button = document.createElement("button");
        button.className = "sticker-pack-tab";
        button.id = "stickerPack-" + pack.id;
        button.value = pack.id;
        button.title = pack.name;
        button.setAttribute("role", "tab");
        button.setAttribute("aria-label", pack.name);
        button.setAttribute("aria-controls", "stickerGrid");
        const img = document.createElement("img");
        img.src = STICKERS.get(pack.id + "01").src;
        img.alt = "";
        img.width = img.height = 36;
        img.loading = "lazy";
        img.decoding = "async";
        button.appendChild(img);
        button.addEventListener("click", () => showStickerPack(pack.id));
        button.addEventListener("keydown", e => {
          if (button.disabled || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
          e.preventDefault();
          const index = stickerPackButtons.findIndex(([id]) => id === pack.id);
          const last = stickerPackButtons.length - 1;
          const next = e.key === "Home" ? 0 : e.key === "End" ? last
            : (index + (e.key === "ArrowRight" ? 1 : -1) + last + 1) % (last + 1);
          const [id, target] = stickerPackButtons[next];
          showStickerPack(id);
          target.focus();
        });
        tabs.appendChild(button);
        stickerPackButtons.push([pack.id, button]);
      }
      updateStickerSelection();
      $("stickerToggle").hidden = packs.length === 0;
    }

    async function replaySticker(img, sticker) {
      const book = currentBook;
      if (!sticker?.animated || getRoomSticker(sticker.id, book) !== sticker) return;
      const request = {};
      stickerReplayRequests.set(img, request);
      try {
        let pending = stickerBlobs.get(sticker.id);
        if (!pending) {
          // 같은 파일은 브라우저 캐시/메모리에서 재사용합니다. Firebase 요청은 없습니다.
          pending = fetch(sticker.src, { cache: "force-cache" }).then(response => {
            if (!response.ok) throw new Error("Sticker unavailable");
            return response.blob();
          });
          stickerBlobs.set(sticker.id, pending);
          pending.catch(() => {
            if (stickerBlobs.get(sticker.id) === pending) stickerBlobs.delete(sticker.id);
          });
        }
        const blob = await pending;
        if (currentBook !== book || stickerReplayRequests.get(img) !== request) return;
        // 매번 새 로컬 URL을 사용해 이 이미지의 애니메이션을 첫 프레임부터 시작합니다.
        const previous = img.src;
        const url = URL.createObjectURL(blob);
        stickerReplayUrls.add(url);
        img.src = url;
        if (stickerReplayUrls.delete(previous)) URL.revokeObjectURL(previous);
      } catch {
        if (currentBook === book && stickerReplayRequests.get(img) === request) {
          alert("이모티콘을 다시 불러오지 못했습니다. 잠시 후 다시 눌러주세요.");
        }
      }
    }

    function updateStickerSelection() {
      const busy = !!currentBook?.sendingSticker;
      for (const [id, button] of stickerButtons) {
        button.setAttribute("aria-pressed", String(selectedSticker?.id === id));
        button.disabled = busy;
      }
      for (const [id, button] of stickerPackButtons) {
        button.setAttribute("aria-selected", String(id === activeStickerPack));
        button.tabIndex = id === activeStickerPack ? 0 : -1;
        button.disabled = busy;
      }
      const pack = STICKER_PACKS.find(pack => pack.id === activeStickerPack);
      $("stickerPackName").textContent = pack?.name || "";
      $("stickerPackName").title = pack?.name || "";
      if (pack) $("stickerGrid").setAttribute("aria-labelledby", "stickerPack-" + pack.id);
      $("stickerSend").disabled = !selectedSticker || busy;
      $("stickerSend").textContent = busy ? "보내는 중…" : "보내기";
      $("stickerPreview").hidden = !selectedSticker;
      if (selectedSticker) {
        $("stickerPreview").src = selectedSticker.src;
        $("stickerPreview").alt = selectedSticker.label;
      } else {
        $("stickerPreview").removeAttribute("src");
      }
      $("stickerLabel").textContent = selectedSticker?.label || "이모티콘을 선택하세요.";
    }

    function selectSticker(id) {
      if (!isStickerRoom() || currentBook.sendingSticker || $("stickerPanel").hidden) return;
      selectedSticker = getRoomSticker(id);
      updateStickerSelection();
    }

    function showStickerPack(id = activeStickerPack) {
      const pack = STICKER_PACKS.find(pack => pack.id === id && pack.roomId === currentBook?.roomId);
      if (!pack || currentBook.sendingSticker || $("stickerPanel").hidden) return;
      if (activeStickerPack === pack.id && stickerButtons.length) return;
      activeStickerPack = pack.id;
      selectedSticker = null;
      stickerButtons = [];
      $("stickerGrid").innerHTML = "";
      $("stickerGrid").scrollTop = 0;
      for (const sticker of STICKERS.values()) {
        if (sticker.pack !== activeStickerPack || !getRoomSticker(sticker.id)) continue;
        const button = document.createElement("button");
        button.className = "sticker-choice";
        button.setAttribute("aria-label", sticker.label);
        const img = document.createElement("img");
        img.src = sticker.src;
        img.alt = sticker.label;
        img.width = img.height = 96;
        img.loading = "lazy";
        img.decoding = "async";
        button.appendChild(img);
        button.addEventListener("click", () => selectSticker(sticker.id));
        $("stickerGrid").appendChild(button);
        stickerButtons.push([sticker.id, button]);
      }
      updateStickerSelection();
    }

    function closeStickerPicker() {
      $("stickerPanel").hidden = true;
      $("stickerToggle").setAttribute("aria-expanded", "false");
      selectedSticker = null;
      stickerButtons = [];
      $("stickerGrid").innerHTML = "";
      updateStickerSelection();
    }

    function toggleStickerPicker() {
      if (!isStickerRoom()) return;
      if (!$("stickerPanel").hidden) { closeStickerPicker(); return; }
      $("stickerPanel").hidden = false;
      $("stickerToggle").setAttribute("aria-expanded", "true");
      showStickerPack();
    }

    async function sendSticker() {
      const book = currentBook;
      const sticker = selectedSticker;
      if (!getRoomSticker(sticker?.id, book) || book.sendingSticker || $("stickerPanel").hidden) return;
      book.sendingSticker = true;
      updateStickerSelection();
      try {
        await storeMessage(book, STICKER_PREFIX + sticker.id);
        if (currentBook !== book) return;
        closeStickerPicker();
        $("text").focus();
      } catch {
        if (currentBook === book) alert("이모티콘을 보내지 못했습니다. 다시 시도하세요.");
      } finally {
        book.sendingSticker = false;
        if (currentBook === book) updateStickerSelection();
      }
    }

    async function openBook() {
      if (opening || currentBook) return;
      const name = $("name").value.trim();
      const pass = $("pass").value;
      if (!isConfigured) { alert("먼저 Firebase 설정을 완료하세요."); return; }
      if (!name || !pass) { alert("사용자와 암호를 입력하세요."); return; }

      opening = true;
      $("enter").disabled = true;
      try {
        const roomId = await resolveRoomId(pass);
        const key = await deriveKey(pass, roomId);
        const book = { roomId, key, name, notificationsEnabled: false, notificationsReady: false,
          seenMessages: new Set(), ownMessages: new Set() };
        try { book.notificationsEnabled = localStorage.getItem(notificationPreferenceKey(roomId)) === "on"; } catch {}
        currentBook = book;
        sessionStorage.setItem("book", JSON.stringify({ name, pass }));

        loginEl.style.display = "none";
        sheetEl.style.display = "flex";
        configureStickerPicker(book);
        updateNotificationToggle();
        $("text").focus();

        const msgsRef = collection(db, "rooms", book.roomId, "messages");
        const q = query(msgsRef, orderBy("createdAt", "asc"), limitToLast(1000));
        let pendingSnapshot = Promise.resolve();
        const onError = () => {
          if (currentBook !== book) return;
          closeBook();
          alert("문서를 열 수 없습니다. 연결 상태와 문서 권한을 확인하세요.");
        };
        unsubscribe = onSnapshot(q, { includeMetadataChanges: true }, (snap) => {
          // 캐시와 최초 서버 기록은 조용히 불러오고, 그 뒤의 서버 수신만 알립니다.
          const mayNotify = book.notificationsReady && book.notificationsEnabled && !snap.metadata.fromCache;
          if (!snap.metadata.fromCache) book.notificationsReady = true;
          // 복호화 중 닫거나 다른 방을 열어도 이전 방의 행을 추가하지 않습니다.
          pendingSnapshot = pendingSnapshot.then(async () => {
            if (currentBook !== book) return;
            let notificationSender = null;
            let rowsAdded = false;
            for (const change of snap.docChanges()) {
              if (change.type !== "added") continue;
              const d = change.doc.data();
              const id = change.doc.id;
              if (book.seenMessages.has(id)) continue;
              book.seenMessages.add(id);
              const text = await decryptText(book.key, d.iv, d.ct);
              if (currentBook !== book) return;
              renderRow(d.sender, text, d.createdAt);
              rowsAdded = true;
              const age = Date.now() - (d.createdAt?.toMillis?.() ?? 0);
              if (mayNotify && text !== "#VALUE!" && !change.doc.metadata.hasPendingWrites
                  && !book.ownMessages.has(d.ct) && age >= -30000 && age <= 120000) {
                notificationSender = d.sender;
              }
            }
            if (rowsAdded) {
              renumber();
              gridEl.scrollTop = gridEl.scrollHeight;
            }
            // 같은 스냅샷의 여러 메시지는 배너 하나로 묶습니다.
            if (notificationSender !== null) notifyReceivedMessage(book, notificationSender);
          }).catch(onError);
          return pendingSnapshot;
        }, onError);
      } catch {
        closeBook();
        alert("문서를 열지 못했습니다. 다시 시도하세요.");
      } finally {
        opening = false;
        $("enter").disabled = false;
      }
    }

    // 시트 행 하나 추가 (행번호 + A열 내용 + 빈 B/C/D 셀)
    function appendRow(aHtml, cls) {
      const tr = document.createElement("tr");
      tr.className = "row" + (cls ? " " + cls : "");
      tr.innerHTML =
        `<td class="rownum"></td>` +
        `<td class="c-a">${aHtml}</td>` +
        `<td></td><td></td><td></td>`;
      rowsEl.appendChild(tr);
      return tr;
    }

    function renumber() {
      let i = 0;
      for (const tr of rowsEl.children) {
        tr.firstElementChild.textContent = ++i;
      }
    }

    function timeStr(d) {
      let h = d.getHours();
      const m = String(d.getMinutes()).padStart(2, "0");
      const ap = h < 12 ? "오전" : "오후";
      h = h % 12; if (h === 0) h = 12;
      return `${ap} ${h}:${m}`;
    }

    function renderRow(sender, text, ts) {
      const time = ts?.toDate ? ts.toDate() : new Date();
      // 새 발신자면 이름 행을 먼저 추가 (같은 사람 연속이면 이름 생략)
      if (sender !== lastSender) {
        appendRow(`${escapeHtml(sender)}:`, "namerow");
        lastSender = sender;
      }
      // 이 방에서만 허용된 로컬 이미지로 해석합니다. 임의 URL/HTML은 실행하지 않습니다.
      const sticker = text.startsWith(STICKER_PREFIX)
        ? getRoomSticker(text.slice(STICKER_PREFIX.length)) : null;
      let content = escapeHtml(text);
      if (sticker) {
        content = `<img class="sticker-message" src="${sticker.src}" alt="${escapeHtml(sticker.label)}" width="80" height="80" loading="lazy" decoding="async">`;
        if (sticker.animated) {
          content = `<button class="sticker-replay" data-sticker="${sticker.id}" aria-label="${escapeHtml(sticker.label)} 다시 재생" title="누르면 다시 재생">${content}</button>`;
        }
      }
      appendRow(`${content}<span class="msgtime">${timeStr(time)}</span>`, "msgrow");
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function storeMessage(book, text) {
      const { iv, ct } = await encryptText(book.key, text);
      if (currentBook !== book) return;
      book.ownMessages.add(ct);
      await addDoc(collection(db, "rooms", book.roomId, "messages"), {
        sender: book.name, iv, ct, createdAt: serverTimestamp()
      });
    }

    async function addRow() {
      const book = currentBook;
      const input = $("text");
      const text = input.value.trim();
      if (!book || !text) return;
      input.value = "";
      input.style.height = "auto";
      try {
        await storeMessage(book, text);
      } catch {
        if (currentBook !== book) return;
        input.value = text + (input.value ? "\n" + input.value : "");
        alert("입력 내용을 저장하지 못했습니다. 다시 시도하세요.");
      }
    }

    function closeBook() {
      currentBook = null;
      clearNotifications();
      updateNotificationToggle();
      closeStickerPicker();
      $("stickerToggle").hidden = true;
      $("stickerTabs").innerHTML = "";
      $("stickerPackName").textContent = "";
      $("stickerPackName").title = "";
      $("stickerGrid").removeAttribute("aria-labelledby");
      stickerPackButtons = [];
      activeStickerPack = null;
      if (unsubscribe) unsubscribe();
      unsubscribe = null;
      sessionStorage.removeItem("book");
      rowsEl.innerHTML = "";
      stickerBlobs.clear();
      for (const url of stickerReplayUrls) URL.revokeObjectURL(url);
      stickerReplayUrls.clear();
      lastSender = null;
      $("text").value = "";
      $("text").style.height = "auto";
      $("pass").value = "";
      sheetEl.style.display = "none";
      loginEl.style.display = "block";
    }

    // 자동 높이 textarea + Enter 전송 (Shift+Enter 줄바꿈, IME 조합 중 무시)
    const ta = $("text");
    ta.addEventListener("input", () => {
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    });
    ta.addEventListener("keydown", (e) => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); addRow(); }
    });

    // 글꼴 크기 조절 (+/-), 브라우저에 저장
    let fontSize = parseInt(localStorage.getItem("chatFont") || "14", 10);
    function applyFont() {
      fontSize = Math.max(11, Math.min(26, fontSize));
      rowsEl.style.fontSize = fontSize + "px";
      $("text").style.fontSize = fontSize + "px";
      $("fontSize").textContent = fontSize;
      localStorage.setItem("chatFont", String(fontSize));
    }
    applyFont();
    $("fontMinus").addEventListener("click", () => { fontSize -= 1; applyFont(); });
    $("fontPlus").addEventListener("click", () => { fontSize += 1; applyFont(); });

    $("enter").addEventListener("click", openBook);
    $("add").addEventListener("click", addRow);
    $("close").addEventListener("click", closeBook);
    $("notificationsToggle").addEventListener("click", toggleNotifications);
    $("notificationOpen").addEventListener("click", () => openNotificationChat());
    $("notificationDismiss").addEventListener("click", clearNotifications);
    // 창을 활성화하는 순간 클릭할 화면 배너가 사라지지 않도록 유지합니다.
    globalThis.addEventListener("focus", clearDesktopNotification);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && document.hasFocus()) clearDesktopNotification();
    });
    globalThis.addEventListener("storage", e => {
      if (!currentBook || e.key !== notificationPreferenceKey(currentBook.roomId)) return;
      currentBook.notificationsEnabled = e.newValue === "on";
      updateNotificationToggle();
      if (!currentBook.notificationsEnabled) clearNotifications();
    });
    $("stickerToggle").addEventListener("click", toggleStickerPicker);
    $("stickerClose").addEventListener("click", () => { closeStickerPicker(); $("stickerToggle").focus(); });
    $("stickerSend").addEventListener("click", sendSticker);
    rowsEl.addEventListener("click", e => {
      const button = e.target.closest?.(".sticker-replay");
      const sticker = button && getRoomSticker(button.dataset.sticker);
      if (sticker) replaySticker(button.querySelector("img"), sticker);
    });
    $("stickerPanel").addEventListener("keydown", e => {
      if (e.key === "Escape") { closeStickerPicker(); $("stickerToggle").focus(); }
    });
    ["name", "pass"].forEach((id) =>
      $(id).addEventListener("keydown", (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === "Enter") openBook();
      }));

    const saved = sessionStorage.getItem("book");
    if (saved && isConfigured) {
      const { name, pass } = JSON.parse(saved);
      $("name").value = name; $("pass").value = pass;
    }
  </script>
</body>
</html>
