<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>둘만의 채팅</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e2229;
    --accent: #4f8cff;
    --accent-soft: #2b3a5c;
    --text: #e6e9ef;
    --text-dim: #9aa3b2;
    --bubble-me: #4f8cff;
    --bubble-you: #262b34;
    --danger: #ff6b6b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: radial-gradient(1200px 800px at 70% -10%, #1b2436 0%, var(--bg) 55%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    border: 1px solid #262b34;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }

  /* ---------- Login ---------- */
  #login { padding: 28px 24px 26px; }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 20px; font-weight: 700; margin-bottom: 4px;
  }
  .brand .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 14px var(--accent);
  }
  .subtitle { color: var(--text-dim); font-size: 13px; margin: 0 0 22px; line-height: 1.5; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 12px 14px; font-size: 15px;
    background: var(--panel-2); border: 1px solid #2b313b;
    border-radius: 10px; color: var(--text); outline: none;
    transition: border-color .15s ease;
  }
  input:focus { border-color: var(--accent); }
  .hint { font-size: 11px; color: var(--text-dim); margin-top: 6px; line-height: 1.5; }
  button {
    cursor: pointer; border: none; font-family: inherit;
  }
  .btn-primary {
    width: 100%; margin-top: 22px; padding: 13px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
    border-radius: 10px; transition: filter .15s ease;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .config-warning {
    margin-top: 18px; padding: 12px 14px; font-size: 12.5px; line-height: 1.6;
    background: #2a2016; border: 1px solid #5a3d1a; border-radius: 10px; color: #ffce9e;
  }
  .config-warning code { color: #ffd7ad; }

  /* ---------- Chat ---------- */
  #chat { display: none; flex-direction: column; height: min(80vh, 720px); }
  .chat-header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px; border-bottom: 1px solid #262b34; background: var(--panel-2);
  }
  .chat-header .room { font-weight: 600; font-size: 15px; }
  .chat-header .meta { font-size: 12px; color: var(--text-dim); }
  .chat-header .lock { margin-left: auto; font-size: 12px; color: #7bd88f; }
  .leave {
    background: transparent; color: var(--text-dim); font-size: 12px;
    border: 1px solid #333a44; padding: 6px 10px; border-radius: 8px;
  }
  .leave:hover { color: var(--text); }
  .messages {
    flex: 1; overflow-y: auto; padding: 18px; display: flex;
    flex-direction: column; gap: 10px;
  }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.45; word-wrap: break-word; }
  .msg .who { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
  .msg.me { align-self: flex-end; background: var(--bubble-me); color: #fff; border-bottom-right-radius: 5px; }
  .msg.you { align-self: flex-start; background: var(--bubble-you); border-bottom-left-radius: 5px; }
  .msg .time { font-size: 10px; opacity: .6; margin-top: 4px; text-align: right; }
  .sys { align-self: center; font-size: 12px; color: var(--text-dim); }
  .composer {
    display: flex; gap: 10px; padding: 14px; border-top: 1px solid #262b34; background: var(--panel-2);
  }
  .composer input { flex: 1; }
  .send { padding: 0 20px; background: var(--accent); color: #fff; font-weight: 600; border-radius: 10px; }
  .send:hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <div class="card">
    <!-- 로그인 화면 -->
    <div id="login">
      <div class="brand"><span class="dot"></span> 둘만의 채팅</div>
      <p class="subtitle">이름, 방 코드, 공유 비밀번호를 입력하세요. 방 코드와 비밀번호는 친구와 동일하게 맞춰야 합니다.</p>

      <label for="name">내 이름</label>
      <input id="name" type="text" placeholder="예: 승조" autocomplete="off" />

      <label for="room">방 코드</label>
      <input id="room" type="text" placeholder="예: our-secret-room-2026" autocomplete="off" />
      <div class="hint">추측하기 어려운 값으로 정하세요. 이 코드를 아는 사람만 대화방에 들어올 수 있습니다.</div>

      <label for="pass">공유 비밀번호 (암호화 키)</label>
      <input id="pass" type="password" placeholder="둘만 아는 비밀번호" autocomplete="off" />
      <div class="hint">이 비밀번호로 메시지를 암호화합니다. 서버(Firebase)에는 암호문만 저장돼요.</div>

      <button id="enter" class="btn-primary">입장하기</button>

      <div id="configWarning" class="config-warning" style="display:none;">
        ⚠️ 아직 Firebase 설정이 안 됐어요. <code>index.html</code> 상단의 <code>firebaseConfig</code> 값을 채워주세요. (README 참고)
      </div>
    </div>

    <!-- 채팅 화면 -->
    <div id="chat">
      <div class="chat-header">
        <div>
          <div class="room" id="roomLabel"></div>
          <div class="meta" id="meLabel"></div>
        </div>
        <span class="lock">🔒 종단간 암호화</span>
        <button class="leave" id="leave">나가기</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <input id="text" type="text" placeholder="메시지를 입력하세요..." autocomplete="off" />
        <button class="send" id="send">보내기</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, limit
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // =========================================================================
    // 1) 여기에 본인의 Firebase 프로젝트 설정을 붙여넣으세요. (README 참고)
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDJmPA-dDphGDV8itduujWu3XxrwfQOaJY",
      authDomain: "chatting-99de3.firebaseapp.com",
      projectId: "chatting-99de3",
      storageBucket: "chatting-99de3.firebasestorage.app",
      messagingSenderId: "128388856345",
      appId: "1:128388856345:web:b5aea60f98e024c4388888",
      measurementId: "G-GWVN1W60GE"
    };
    // =========================================================================

    const isConfigured = !firebaseConfig.apiKey.startsWith("YOUR_");

    let db = null;
    if (isConfigured) {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } else {
      document.getElementById("configWarning").style.display = "block";
    }

    // ---------- 암호화 (AES-GCM + PBKDF2) ----------
    const enc = new TextEncoder();
    const dec = new TextDecoder();

    async function deriveKey(passphrase, roomCode) {
      const baseKey = await crypto.subtle.importKey(
        "raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]
      );
      // 방 코드를 salt로 사용 (방마다 다른 키)
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode("chat-salt:" + roomCode), iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    function toB64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
    function fromB64(str) { return Uint8Array.from(atob(str), c => c.charCodeAt(0)); }

    async function encryptText(key, text) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(text));
      return { iv: toB64(iv), ct: toB64(ct) };
    }

    async function decryptText(key, ivB64, ctB64) {
      try {
        const pt = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: fromB64(ivB64) }, key, fromB64(ctB64)
        );
        return dec.decode(pt);
      } catch {
        return "🔒 (복호화 실패 — 비밀번호가 다릅니다)";
      }
    }

    // ---------- UI 요소 ----------
    const $ = (id) => document.getElementById(id);
    const loginEl = $("login");
    const chatEl = $("chat");
    const messagesEl = $("messages");

    let cryptoKey = null;
    let myName = "";
    let unsubscribe = null;

    async function enterRoom() {
      const name = $("name").value.trim();
      const room = $("room").value.trim();
      const pass = $("pass").value;

      if (!isConfigured) { alert("먼저 Firebase 설정을 완료하세요 (README 참고)."); return; }
      if (!name || !room || !pass) { alert("이름, 방 코드, 비밀번호를 모두 입력하세요."); return; }

      myName = name;
      cryptoKey = await deriveKey(pass, room);

      // 세션 저장 (새로고침 시 유지)
      sessionStorage.setItem("chat", JSON.stringify({ name, room, pass }));

      loginEl.style.display = "none";
      chatEl.style.display = "flex";
      $("roomLabel").textContent = "방: " + room;
      $("meLabel").textContent = name + " (으)로 접속됨";

      const msgsRef = collection(db, "rooms", room, "messages");
      const q = query(msgsRef, orderBy("createdAt", "asc"), limit(500));

      unsubscribe = onSnapshot(q, async (snap) => {
        const changes = snap.docChanges();
        for (const change of changes) {
          if (change.type !== "added") continue;
          const d = change.doc.data();
          const text = await decryptText(cryptoKey, d.iv, d.ct);
          renderMessage(d.sender, text, d.createdAt, d.sender === myName);
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    function renderMessage(sender, text, ts, isMe) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + (isMe ? "me" : "you");
      const time = ts?.toDate ? ts.toDate() : new Date();
      const hh = String(time.getHours()).padStart(2, "0");
      const mm = String(time.getMinutes()).padStart(2, "0");
      wrap.innerHTML =
        (isMe ? "" : `<div class="who">${escapeHtml(sender)}</div>`) +
        `<div>${escapeHtml(text)}</div>` +
        `<div class="time">${hh}:${mm}</div>`;
      messagesEl.appendChild(wrap);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function sendMessage() {
      const input = $("text");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      const room = $("room").value.trim();
      const { iv, ct } = await encryptText(cryptoKey, text);
      await addDoc(collection(db, "rooms", room, "messages"), {
        sender: myName, iv, ct, createdAt: serverTimestamp()
      });
    }

    function leaveRoom() {
      if (unsubscribe) unsubscribe();
      sessionStorage.removeItem("chat");
      messagesEl.innerHTML = "";
      chatEl.style.display = "none";
      loginEl.style.display = "block";
    }

    // ---------- 이벤트 ----------
    $("enter").addEventListener("click", enterRoom);
    $("send").addEventListener("click", sendMessage);
    $("leave").addEventListener("click", leaveRoom);
    $("text").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
    ["name", "room", "pass"].forEach((id) =>
      $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") enterRoom(); }));

    // 새로고침 시 자동 복귀
    const saved = sessionStorage.getItem("chat");
    if (saved && isConfigured) {
      const { name, room, pass } = JSON.parse(saved);
      $("name").value = name; $("room").value = room; $("pass").value = pass;
    }
  </script>
</body>
</html>
