<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>메모장</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='2' fill='%234b5563'/><rect x='3' y='4' width='10' height='1.4' fill='white'/><rect x='3' y='7' width='10' height='1.4' fill='white'/><rect x='3' y='10' width='6' height='1.4' fill='white'/></svg>" />
<style>
  :root {
    --bg: #f3f4f6;
    --paper: #ffffff;
    --line: #e5e7eb;
    --text: #1f2937;
    --text-dim: #6b7280;
    --accent: #4b5563;
    --accent-2: #374151;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  /* ---------- 문서 열기 (로그인) ---------- */
  #login {
    width: 100%;
    max-width: 380px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    padding: 30px 28px 26px;
    margin: 16px;
  }
  .doc-head { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .doc-icon { width: 22px; height: 22px; }
  .doc-title { font-size: 17px; font-weight: 600; }
  .doc-sub { color: var(--text-dim); font-size: 13px; margin: 2px 0 24px; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin: 16px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 14px;
    background: #fff; border: 1px solid #d1d5db;
    border-radius: 7px; color: var(--text); outline: none;
    transition: border-color .15s ease;
  }
  input:focus { border-color: var(--accent-2); }
  button { cursor: pointer; border: none; font-family: inherit; }
  .btn-open {
    width: 100%; margin-top: 22px; padding: 11px;
    background: var(--accent-2); color: #fff; font-size: 14px; font-weight: 600;
    border-radius: 7px; transition: filter .15s ease;
  }
  .btn-open:hover { filter: brightness(1.1); }
  .btn-open:disabled { opacity: .5; cursor: not-allowed; }
  .config-warning {
    margin-top: 16px; padding: 10px 12px; font-size: 12px; line-height: 1.6;
    background: #fef3c7; border: 1px solid #fcd34d; border-radius: 7px; color: #92400e;
  }

  /* ---------- 문서 (채팅) ---------- */
  #doc { display: none; flex-direction: column; height: 100vh; width: 100%; background: var(--paper); }
  .toolbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 16px; border-bottom: 1px solid var(--line); background: #fafafa;
    font-size: 13px;
  }
  .toolbar .fname { font-weight: 600; }
  .toolbar .saved { color: var(--text-dim); font-size: 12px; }
  .toolbar .menu { color: var(--text-dim); display: flex; gap: 14px; }
  .toolbar .menu span { cursor: default; }
  .toolbar .spacer { margin-left: auto; }
  .zoom { display: flex; align-items: center; gap: 4px; }
  .zoom button {
    width: 26px; height: 26px; line-height: 1; font-size: 14px; font-weight: 600;
    background: #fff; color: var(--accent-2); border: 1px solid #d1d5db; border-radius: 6px;
  }
  .zoom button:hover { background: #f3f4f6; }
  .zoom .size { font-size: 11px; color: var(--text-dim); min-width: 30px; text-align: center; }
  .toolbar .close {
    background: transparent; color: var(--text-dim);
    font-size: 12px; border: 1px solid #d1d5db; padding: 5px 10px; border-radius: 6px;
  }
  .toolbar .close:hover { color: var(--text); background: #fff; }

  /* 좁은 화면: 작성자+시간은 윗줄, 내용은 아랫줄. 메시지 간 간격은 넉넉히 */
  @media (max-width: 520px) {
    .toolbar .menu { display: none; }
    .page { padding: 18px 14px; gap: 12px; }
    .line { flex-wrap: wrap; column-gap: 8px; row-gap: 2px; padding: 4px 6px; }
    .line .author { min-width: 0; }
    .line .ts { order: 2; align-self: center; }
    .line .content { order: 3; flex: 1 1 100%; }
  }
  .page {
    flex: 1; overflow-y: auto; padding: 26px 22px;
    display: flex; flex-direction: column; gap: 2px;
    max-width: 820px; width: 100%; margin: 0 auto;
    font-size: 14px;
  }
  /* 대화를 문서의 한 줄처럼 표시 */
  .line {
    display: flex; gap: 10px; padding: 3px 6px; border-radius: 4px;
    font-size: inherit; line-height: 1.6;
  }
  .line:hover { background: #f9fafb; }
  .line .author { flex-shrink: 0; font-weight: 600; color: var(--accent-2); min-width: 64px; }
  .line.me .author { color: #1d4ed8; }
  .line .content { flex: 1; min-width: 0; word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap; }
  .line .ts { flex-shrink: 0; font-size: 0.8em; color: #b0b6c0; align-self: center; }
  .editor {
    display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 16px; border-top: 1px solid var(--line); background: #fafafa;
    max-width: 820px; width: 100%; margin: 0 auto;
  }
  .editor textarea {
    flex: 1; min-width: 0; resize: none; font-family: inherit; font-size: 14px; line-height: 1.5;
    padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 7px;
    outline: none; max-height: 120px; color: var(--text);
  }
  .editor textarea:focus { border-color: var(--accent-2); }
  .editor .add {
    padding: 8px 16px; background: var(--accent-2); color: #fff; font-weight: 600;
    border-radius: 7px; font-size: 13px; align-self: stretch;
  }
  .editor .add:hover { filter: brightness(1.1); }
</style>
</head>
<body>
  <!-- 문서 열기 (로그인) -->
  <div id="login">
    <div class="doc-head">
      <svg class="doc-icon" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="1.8">
        <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
        <path d="M14 3v6h6M8 13h8M8 17h5"/>
      </svg>
      <span class="doc-title">보호된 문서</span>
    </div>
    <p class="doc-sub">이 문서는 암호로 보호되어 있습니다. 열려면 정보를 입력하세요.</p>

    <label for="name">작성자</label>
    <input id="name" type="text" placeholder="이름" autocomplete="off" />

    <label for="pass">문서 암호</label>
    <input id="pass" type="password" placeholder="암호 입력" autocomplete="off" />

    <button id="enter" class="btn-open">문서 열기</button>

    <div id="configWarning" class="config-warning" style="display:none;">
      Firebase 설정이 필요합니다. (README 참고)
    </div>
  </div>

  <!-- 문서 (채팅) -->
  <div id="doc">
    <div class="toolbar">
      <span class="fname">회의록.docx</span>
      <span class="saved">저장됨</span>
      <span class="menu"><span>파일</span><span>편집</span><span>보기</span><span>서식</span></span>
      <span class="spacer"></span>
      <div class="zoom">
        <button id="fontMinus" title="글꼴 작게">−</button>
        <span class="size" id="fontSize">14</span>
        <button id="fontPlus" title="글꼴 크게">+</button>
      </div>
      <button class="close" id="close">닫기</button>
    </div>
    <div class="page" id="page"></div>
    <div class="editor">
      <textarea id="text" rows="1" placeholder="내용을 입력하세요..."></textarea>
      <button class="add" id="add">추가</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, limit
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // =========================================================================
    // Firebase 설정
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDJmPA-dDphGDV8itduujWu3XxrwfQOaJY",
      authDomain: "chatting-99de3.firebaseapp.com",
      projectId: "chatting-99de3",
      storageBucket: "chatting-99de3.firebasestorage.app",
      messagingSenderId: "128388856345",
      appId: "1:128388856345:web:b5aea60f98e024c4388888",
      measurementId: "G-GWVN1W60GE"
    };

    // 고정된 방 (사용자에게 노출되지 않음). 이 값 하나만 사용됩니다.
    const ROOM_ID = "sjchat-private-2026";
    // =========================================================================

    const isConfigured = !firebaseConfig.apiKey.startsWith("YOUR_");
    let db = null;
    if (isConfigured) {
      db = getFirestore(initializeApp(firebaseConfig));
    } else {
      document.getElementById("configWarning").style.display = "block";
    }

    // ---------- 암호화 (AES-GCM + PBKDF2) ----------
    const enc = new TextEncoder();
    const dec = new TextDecoder();

    async function deriveKey(passphrase) {
      const baseKey = await crypto.subtle.importKey(
        "raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode("chat-salt:" + ROOM_ID), iterations: 100000, hash: "SHA-256" },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }
    const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const fromB64 = (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0));

    async function encryptText(key, text) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(text));
      return { iv: toB64(iv), ct: toB64(ct) };
    }
    async function decryptText(key, ivB64, ctB64) {
      try {
        const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(ivB64) }, key, fromB64(ctB64));
        return dec.decode(pt);
      } catch {
        return "(잠긴 내용 — 암호가 다릅니다)";
      }
    }

    // ---------- UI ----------
    const $ = (id) => document.getElementById(id);
    const loginEl = $("login");
    const docEl = $("doc");
    const pageEl = $("page");

    let cryptoKey = null;
    let myName = "";
    let unsubscribe = null;

    async function openDoc() {
      const name = $("name").value.trim();
      const pass = $("pass").value;
      if (!isConfigured) { alert("먼저 Firebase 설정을 완료하세요."); return; }
      if (!name || !pass) { alert("작성자와 문서 암호를 입력하세요."); return; }

      myName = name;
      cryptoKey = await deriveKey(pass);
      sessionStorage.setItem("doc", JSON.stringify({ name, pass }));

      loginEl.style.display = "none";
      docEl.style.display = "flex";
      $("text").focus();

      const msgsRef = collection(db, "rooms", ROOM_ID, "messages");
      const q = query(msgsRef, orderBy("createdAt", "asc"), limit(1000));
      unsubscribe = onSnapshot(q, async (snap) => {
        for (const change of snap.docChanges()) {
          if (change.type !== "added") continue;
          const d = change.doc.data();
          const text = await decryptText(cryptoKey, d.iv, d.ct);
          renderLine(d.sender, text, d.createdAt, d.sender === myName);
        }
        pageEl.scrollTop = pageEl.scrollHeight;
      });
    }

    function renderLine(sender, text, ts, isMe) {
      const time = ts?.toDate ? ts.toDate() : new Date();
      const hh = String(time.getHours()).padStart(2, "0");
      const mm = String(time.getMinutes()).padStart(2, "0");
      const row = document.createElement("div");
      row.className = "line" + (isMe ? " me" : "");
      row.innerHTML =
        `<span class="author">${escapeHtml(sender)}</span>` +
        `<span class="content">${escapeHtml(text)}</span>` +
        `<span class="ts">${hh}:${mm}</span>`;
      pageEl.appendChild(row);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function addLine() {
      const input = $("text");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      input.style.height = "auto";
      const { iv, ct } = await encryptText(cryptoKey, text);
      await addDoc(collection(db, "rooms", ROOM_ID, "messages"), {
        sender: myName, iv, ct, createdAt: serverTimestamp()
      });
    }

    function closeDoc() {
      if (unsubscribe) unsubscribe();
      sessionStorage.removeItem("doc");
      pageEl.innerHTML = "";
      docEl.style.display = "none";
      loginEl.style.display = "block";
    }

    // 자동 높이 조절 textarea + Enter 전송 (Shift+Enter 줄바꿈)
    const ta = $("text");
    ta.addEventListener("input", () => {
      ta.style.height = "auto";
      ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
    });
    ta.addEventListener("keydown", (e) => {
      // 한글/일본어 등 IME 조합 중에는 Enter를 전송으로 처리하지 않음 (마지막 글자 중복 방지)
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); addLine(); }
    });

    // 글꼴 크기 조절 (+/-), 브라우저에 저장
    let fontSize = parseInt(localStorage.getItem("chatFont") || "14", 10);
    function applyFont() {
      fontSize = Math.max(11, Math.min(26, fontSize));
      pageEl.style.fontSize = fontSize + "px";
      $("text").style.fontSize = fontSize + "px";
      $("fontSize").textContent = fontSize;
      localStorage.setItem("chatFont", String(fontSize));
    }
    applyFont();
    $("fontMinus").addEventListener("click", () => { fontSize -= 1; applyFont(); });
    $("fontPlus").addEventListener("click", () => { fontSize += 1; applyFont(); });

    $("enter").addEventListener("click", openDoc);
    $("add").addEventListener("click", addLine);
    $("close").addEventListener("click", closeDoc);
    ["name", "pass"].forEach((id) =>
      $(id).addEventListener("keydown", (e) => {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === "Enter") openDoc();
      }));

    const saved = sessionStorage.getItem("doc");
    if (saved && isConfigured) {
      const { name, pass } = JSON.parse(saved);
      $("name").value = name; $("pass").value = pass;
    }
  </script>
</body>
</html>
